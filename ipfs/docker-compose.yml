version: '3'

services:
  ipfs:
    image: ipfs/kubo:latest
    container_name: ipfs_node
    restart: unless-stopped
    ports:
      - "4001:4001"
      - "4001:4001/udp"
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:5001:5001"
    volumes:
      - ./staging:/export
      - /d/dev/docker/ipfs/data:/data/ipfs